<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صعود قديس العوالم السبع — قراءة الفصول</title><link rel="stylesheet" href="../style.css"><style>body{background:#11131a;color:#eee;font-family:Tahoma,Arial,sans-serif;line-height:2}.reader{max-width:850px;margin:35px auto;padding:0 16px}.chapter{background:#15121a;border:1px solid #2c2632;border-radius:18px;padding:clamp(22px,5vw,45px)}.chapter h1{text-align:center;color:#e5c77b;margin-bottom:30px}.chapter p{font-size:19px;line-height:2.25;color:#ddd;margin:0 0 22px}.chapter-label{text-align:center;color:#c99a5b;margin-bottom:10px}.controls{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.controls a{background:#1b1721;color:#e5c77b;border:1px solid #3a3042;border-radius:9px;padding:9px 14px;text-decoration:none}.controls a.disabled{opacity:.35;pointer-events:none}.end{text-align:center;color:#e5c77b;margin-top:3rem}h3{color:#c9a95e}@media(max-width:600px){.chapter{padding:20px 16px}.chapter p{font-size:16px}}</style></head><body><main class="reader"><div class="controls" id="topControls"></div><article class="chapter" id="chapterBody"></article><div class="controls" id="bottomControls"></div></main><script>const chapters=[
  ["الفصل الأول — الفتى الذي تأخر عن الجميع",[
    "استيقظ يامن قبل شروق الشمس بقليل، لا لأن لديه موعدًا مهمًا، بل لأن سقف غرفته كان يسرّب الماء فوق الوسادة منذ الليلة الماضية. نقل فراشه إلى الطرف الآخر، وظل يستمع إلى القرية وهي تستيقظ: دلو يُسحب من البئر، باب خشبي يئن، وديك يعلن انتصاره على الليل.",
    "كانت نيراف قرية عند سفح تلال رمادية، تتوسطها ساحة السوق ويقسمها جدول ماء صغير إلى حارتين. لم تكن كبيرة بما يكفي ليجهل الناس بعضهم، ولا صغيرة بما يكفي ليغفروا لبعضهم كل شيء. في نيراف يعرف المرء اسم أبيك قبل أن يعرف اسمك، ويتذكر الناس خطأك أطول مما يتذكرون نجاحك.",
    "كان يامن في العشرين، ابن صاحب ورشة الساعات الغائب منذ سبع سنوات. ترك والده وراءه ورشة متعبة وديونًا صغيرة وولدًا لم يعرف كيف يحافظ على ما ورثه. لم يتفق أهل القرية إن كان الأب قد مات أو هرب أو ضل طريقه، لكنهم اتفقوا أن ابنه لم ينجح في إعادة الورشة إلى أيامها القديمة.",
    "حاول يامن إصلاح ساعة الحائط في البيت. فك الغطاء ورتب التروس، فدارت العقارب دقيقة ثم توقفت. كان يفهم أجزاء الساعة حين تكون أمامه، لكنه يتردد كلما اضطر إلى اتخاذ قرار، ويعيد العمل مرات كثيرة حتى يضيع الوقت.",
    "نادته أمه سلمى من المطبخ: «إن تأخرت عن السوق مرة أخرى فلن يدفع لنا صاحب الدقيق ما علينا». لم يكن صوتها قاسيًا، بل متعبًا. أخفى الساعة في الدرج وخرج حاملاً صندوق أدواته.",
    "مر بجاره العم رافع، فحيّاه الرجل وسأله عن الورشة. وقبل أن يجيب، مر سليم على حصانه الصغير، فرفع رافع صوته مرحبًا به: «سمعت أنك فزت في اختبار الحدادين!» ابتسم سليم ومضى. كان صديق يامن في طفولته، لكنه صار متدربًا عند أشهر حداد في نيراف، بينما بقي يامن يحاول إبقاء ورشة أبيه مفتوحة.",
    "لم يكره يامن سليمًا. لكنه شعر بوخزة مألوفة عندما سمع الناس يمدحونه ثم يسألونه إن كان وجد عملًا حقيقيًا بعد. رفع عينيه إلى برج الساعة ولاحظ أنها متأخرة سبع دقائق. لم يكن أحد غيره يهتم، لكنه كان يعرف ذلك."
  ]],
  ["الفصل الثاني — بيت لا ينام على صوت واحد",[
    "كان الإفطار في بيت يامن يجري وفق ترتيب لا يتغير: أمه تضع الخبز، خالته عواطف تتحدث قبل أن يجلس الجميع، وابن خالته فؤاد يراجع أخبار القرية كأنه مسؤول عنها. جلس يامن قرب النافذة، حيث يسمع السوق دون أن يضطر إلى المشاركة.",
    "لم تكن سلمى قاسية. باعت حليًا ورثتها عن أمها لتسدد جزءًا من ديون الورشة، وتعمل ساعات طويلة في خياطة ثياب نساء القرية. لكنها لم تعد تعرف كيف تدافع عن ابنها أمام الأقارب؛ فكل وعد جديد منه يوقظ خوفًا قديمًا من خيبة أخرى.",
    "قالت خالته عواطف: «سليم صار له اسم عند الحدادين، وفؤاد سيذهب إلى المدينة ليتعلم التجارة. أما يامن فما زال يطارد عقارب الساعات». لم تضحك، وربما ظنت أنها تنصحه. لكن فؤاد ابتسم ابتسامة صغيرة لم يخفها.",
    "رد يامن بأن الساعات لا تطارد أحدًا، بل تتوقف حين لا يعرف صاحبها موضع الخلل. سأله فؤاد: «وهل عرفت أنت الخلل؟» كان لدى يامن جواب، لكنه ابتلعه؛ فقد اعتاد أن يتحول دفاعه عن نفسه إلى دليل جديد على عناده.",
    "أعطته أمه كيسًا صغيرًا من النقود لشراء الزيت وتسليم جزء من الدين. لم يكن فيه ما يكفي للأمرين، فاختار الزيت وأجّل مواجهة صاحب الدقيق. قبل خروجه لمح صندوق أبيه الخشبي تحت سرير أمه، فسألها عنه. وضعت يدها عليه وقالت: «ليس اليوم يا يامن».",
    "لحق به فؤاد في الطريق وعرض أن يوصي به عند تاجر ساعات في المدينة. رفض يامن؛ لم يرد ترك الورشة قبل أن يحاول إنقاذها. قال فؤاد: «أنت لا تريد المساعدة، أنت تريد أن تثبت أن أباك لم يترك لك خرابًا». أصابت العبارة موضعًا حساسًا، فواصل يامن طريقه دون جواب.",
    "أخرج من جيبه ترسًا صغيرًا صنع له بديلًا من النحاس. لم يخبر أحدًا. لم يكن عاجزًا عن التعلم؛ كان يتعلم ببطء، وحيدًا، ومن دون من يريه كيف يختصر الطريق."
  ]],
  ["الفصل الثالث — سوق نيراف يعرف الجميع",[
    "كان سوق نيراف يبدأ من بئر مربعة وينتهي عند دكان العطار. بينهما صفوف من الأكشاك: أم نوال تخرج الأرغفة قبل طلوع الشمس، وجابر يزن الخضار بيده أكثر مما يزنها بميزانه، والعم حمدان يطرق الحديد حتى تهتز السقوف، ومراد بائع الأدوات القديمة يعرض أشياء لا يعرف أحد إن كانت نافعة أم خردة.",
    "عرف يامن هؤلاء منذ طفولته. أم نوال كانت تعطيه طرف رغيف حين يتأخر أبوه في الورشة. جابر يمازحه ثم يطالبه بثمن الخضار القديم. والعم حمدان لا يجيد الكلام اللطيف، لكنه أصلح مفصلة باب الورشة مرتين ولم يأخذ أجرًا كاملًا.",
    "وضع يامن ساعة جيب على طاولة مراد. قال البائع إن إصلاحها سيكلف أكثر من ثمنها. أشار يامن إلى أن العقرب يتوقف عند الموضع نفسه، وأن المشكلة قد تكون في سن صغير لا في الآلية كلها. ضحك مراد، ثم فحص الموضع واكتشف أن ملاحظته صحيحة.",
    "جلس يامن على صندوق قرب الدكان ونظف المحور، ثم صنع من سلك نحاسي رفيع قطعة بديلة. احتاج إلى محاولتين، وفي الثالثة عادت الساعة إلى الحركة. لم تكن معجزة، لكنها أول مرة منذ أسابيع ينهي فيها عملًا أمام الناس دون تعليق ساخر.",
    "ابتسمت أم نوال وقالت إن يد أبيه كانت تفعل الشيء نفسه. أما جابر فقال إن إصلاح ساعة واحدة لا يسدد دينًا. كانت الكلمتان صادقتين؛ واحدة أعادت إليه شيئًا من الأمل، والأخرى ذكرته بأن الأمل وحده لا يكفي.",
    "عند الظهيرة وصلت عربة عائلة الدرويش، أغنى عائلات نيراف. نزل التاجر نجيب وابنته مريم، وتبعهما خادم يحمل صندوق ساعات مستوردة. خفّض أصحاب الأكشاك أصواتهم؛ فالعائلة تموّل مخزن الحبوب وتملك عددًا من الدكاكين حول الساحة.",
    "سألت مريم عن الساعة التي أصلحها يامن، واستَمعت إلى شرحه باهتمام. قالت إن والدها يبحث عن صانع ساعات يساعد في فحص بضاعة وصلت من المدينة. قبل أن يجيب، قال نجيب إنهم يحتاجون إلى خبير لا إلى تجارب مبتدئ. لم تكن كلماته صاخبة، لكنها أغلقت الباب أمام فرصة لم تُمنح بعد."
  ]],
  ["الفصل الرابع — أبناء العائلات الكبيرة",[
    "لم تكن عائلات نيراف متساوية في المكانة، وإن كان الجميع يشربون من البئر نفسها. عائلة الدرويش تملك المال والمخازن، وعائلة الحداد معروفة بالحرفة والصلابة، وعائلة النجارين تشتهر بالتعليم والحساب، أما عائلة يامن فكان اسمها يومًا مرتبطًا بالساعات الدقيقة ثم صار مرتبطًا بغياب رجل وورشة تتراكم عليها الديون.",
    "في بيت آل حداد، كان سليم يتناول الغداء مع أبيه حمدان. تحدثا عن الاختبار الذي فاز به وفرصة السفر إلى المدينة. لم يكن سليم متكبرًا دائمًا؛ كان مجتهدًا ويخشى أن يخيب أمل أبيه. لكنه تعلّم أن يضحك حين يذكر أحدهم يامن حتى لا يبدو مختلفًا عن رفاقه.",
    "في بيت الدرويش، أراد نجيب شراء ورشة الساعات بثمن منخفض قبل أن تتراكم ديونها. رأت مريم أن الورشة يمكن إنقاذها وأن يامن قد يكون موهوبًا لكنه يحتاج إلى تدريب. قال أبوها إن السوق لا يدفع ثمن الاحتمالات.",
    "اجتمعت عائلة يامن عند خالته عواطف. رأى عمه جلال أن إبقاء الورشة مفتوحة يستهلك ما بقي من مال سلمى. قال يامن إنه يستطيع تسديد جزء من الدين إذا حصل على أعمال أكثر، فسأله عمه عن عدد الساعات التي أصلحها هذا الشهر. لم يجب؛ كان العدد أقل مما وعد به.",
    "قالت سلمى إنها لا تريد بيع الورشة الآن. لم تكن موافقتها تعني أنها واثقة من نجاحه، بل أنها لا تحتمل رؤية آخر أثر لزوجها يختفي. وبعد انصراف الأقارب قالت له: «أنا لا أخاف من فشلك يا بني، أخاف أن تقضي عمرك تحاول إثبات شيء للناس الذين لن يرضوا».",
    "فتح يامن دفتر الحسابات وكتب أسماء من يدين لهم، وأسماء من وعدوه بعمل، ووضع أمام كل اسم موعدًا. لم يعد يكفيه أن يقول إنه سيحاول. كان عليه أن يعرف ما يستطيع فعله وما يحتاج إلى تعلمه."
  ]],
  ["الفصل الخامس — صديق الأمس",[
    "كان لسليم ويامن مقعد قديم تحت شجرة التوت قرب الجدول. اعتادا الجلوس هناك بعد العمل وتبادل القصص والتخطيط للسفر إلى المدينة. منذ عامين صار سليم يأتي أقل، ثم صار يمر دون أن يتوقف. لم يتشاجرا؛ أحيانًا تنتهي الصداقة بالتدريج حين تصبح حياة أحدهما أسرع من أن ينتظر الآخر.",
    "وجد يامن سليمًا عند الحداد يجهز أدوات سفره. هنأه على فرصة المدينة. رد سليم بالشكر ثم قال إن يامن يجعل كل نصيحة تبدو كأنها إهانة. أجابه يامن بأنه لا يطلب من أحد أن ينقذه، لكنه يريد فرصة حقيقية.",
    "وصل الصبي رامي يحمل ساعة مكسورة تخص أمه. لم يملك مالًا كافيًا، فعرض أن يساعد في تنظيف الورشة. وافق يامن رغم أن الساعة قديمة ولا تساوي كثيرًا. قال سليم إن يامن يضيع وقته في أعمال لا تدر ربحًا، لكن يامن أصر على وعده للصبي.",
    "في المساء عاد رامي ومعه قطعة خبز وقطعة قماش نظيفة. قال إن أمه طلبت منه ألا ينسى أجر يامن. ضحك يامن وأخبره أن أجره هو أن يتعلم كيف يحافظ على ساعته. جلس الصبي قربه يسأله عن التروس، وللمرة الأولى منذ زمن شرح يامن شيئًا دون خوف من السخرية.",
    "بعد أن غادر رامي، وجد يامن ورقة تحت الباب. كانت من سليم، وفيها موعد اختبار الحرفيين الذي سيقام بعد أسبوع. كتب سليم: «لو أردت أن تثبت أنك قادر، فهذه فرصتك». لم يعرف يامن إن كانت دعوة صادقة أم تحديًا، لكنه قرر الذهاب."
  ]],
  ["الفصل السادس — ساعة لا يستطيع أحد إصلاحها",[
    "أحضر مراد إلى الورشة ساعة جيب لا تشبه ما اعتاد يامن إصلاحه. غلافها أسود مطفأ، وعلى حافتها سبع علامات دقيقة. قال إنه وجدها بين أغراض مخزن قديم ويريد معرفة إن كانت تعمل قبل عرضها للبيع.",
    "ما إن وضعها يامن على الطاولة حتى شعر أن تصميمها يخفي خللًا. فتح الغطاء بحذر، فوجد آلية لا تتوافق مع أي نموذج تعلمه من أبيه. حاول تحريك الترس الأول فلم يتحرك، وسمع طقطقة خافتة من الداخل، فتوقف فورًا. لم يكن يحب إجبار الآليات؛ كان يرى أن القوة قد تكسر ما لم يفهمه بعد.",
    "دخلت سلمى ولاحظت الساعة. سألت من أين جاءت، ثم تغير وجهها حين عرفَت أنها من مراد. طلبت من يامن أن يعيدها كما كانت. لم تشرح السبب، وحين ألح قالت إن بعض الأشياء لا تخصه وحده. أدرك يامن أنها تعرفها، وأن اختفاء أبيه ليس السؤال الوحيد الذي تركه البيت بلا إجابة.",
    "في الساحة أُعلن اختبار الحرفيين. سيختار نجيب الدرويش ثلاثة متدربين للعمل في مخزنه، والاختبار مفتوح لأبناء القرية. وقف سليم بين المتقدمين، ووقف يامن في الطرف الآخر يحمل صندوق أدواته القديم.",
    "طُلب من المتسابقين إصلاح ساعة متوقفة خلال وقت محدد. لاحظ يامن أن صوت إحدى الساعات يختلف عن البقية، لكنه تردد طويلًا قبل اختيارها. اختار سليم ساعة سهلة الفتح وبدأ بثقة. أما يامن ففحص الصوت والوزن وحركة العقارب، ثم اكتشف أن ترسًا داخليًا موضوع بالعكس.",
    "أعاد الترس إلى موضعه فعادت الساعة إلى الدق، لكن الوقت انتهى قبل أن يثبت الغطاء ويقدمها. أعلن الحكم نجاح سليم ومتسابق آخر، واعتُبر عمل يامن غير مكتمل. لم يحتج أحد إلى السخرية؛ نظرات الشفقة كانت أقسى عليه من الضحك.",
    "عاد إلى الورشة بعد الغروب. وضع الساعة السوداء على الطاولة، ولاحظ أن عقاربها تحركت وحدها إلى الوراء، ثم توقفت عند العلامة السابعة. من داخل الغلاف جاء صوت دقة واحدة، كأن شيئًا بعيدًا أجابه."
  ]],
  [
    "الفصل السابع — صحراء النار",
    [
      "قاد أثر البذرة الفضية يامن ولينا إلى حافة الغابة، حيث تحولت الأشجار تدريجيًا إلى أرض جافة تتشقق تحت الأقدام. لم تكن الصحراء خالية؛ كانت أعمدة حجرية تخرج من الرمال، وعلى كل عمود نقش لاسم شخص نسيه العالم.",
      "قالت لينا إنهما دخلا إقليم النار، وإن المسافرين يسمونه صحراء الرماد. هنا لا تحفظ الأرض الذكريات، بل تحفظ الوعود التي لم تُنفذ. كل من يقطعها يسمع وعدًا قديمًا يخصه، حتى لو لم يتذكر أنه قطعه.",
      "لم تمضِ ساعة حتى سمع يامن صوت أبيه يناديه من خلف كثيب. كاد يركض نحوه، لكن شظية البلور التي أعطته إياها سيرا أظهرت أن الصوت لا يملك انعكاسًا. تذكر تحذير ميرا، وتابع السير.",
      "وصل الاثنان إلى قافلة متوقفة حول بئر جاف. كان قائدها رجلًا يدعى جابر، وقد فقدت القافلة طريقها بعد أن تغيرت مواقع النجوم. طلبت لينا الماء مقابل مساعدتهم في إصلاح بوصلة القافلة، لكن جابر رفض استقبال الغرباء.",
      "عندما أضاء الحجر، سقطت من إحدى العربات خريطة قديمة تحمل العلامة نفسها. اعترف جابر أن القافلة تنقل قطعًا أثرية إلى مدينة تحت الرمال، وأن رجلًا مقنعًا دفع لهم مقابل إخفاء القطعة عن حراس الصفر.",
      "وافق جابر على مرافقتهم إلى المدينة بشرط ألا يسألوا عن الحمولة. في الطريق، هاجمتهم عاصفة من الرماد لم تكن تحمل رمالًا، بل شظايا صغيرة من ذكريات أشخاص مجهولين. رأى يامن مشاهد متقطعة لحروب قديمة ومدن تنهار، ثم رأى نفسه طفلًا أمام بوابة زرقاء.",
