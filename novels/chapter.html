<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صعود قديس العوالم السبع — قراءة الفصول</title><link rel="stylesheet" href="../style.css"><style>body{background:#11131a;color:#eee;font-family:Tahoma,Arial,sans-serif;line-height:2}.reader{max-width:850px;margin:35px auto;padding:0 16px}.chapter{background:#15121a;border:1px solid #2c2632;border-radius:18px;padding:clamp(22px,5vw,45px)}.chapter h1{text-align:center;color:#e5c77b;margin-bottom:30px}.chapter p{font-size:19px;line-height:2.25;color:#ddd;margin:0 0 22px}.chapter-label{text-align:center;color:#c99a5b;margin-bottom:10px}.controls{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.controls a{background:#1b1721;color:#e5c77b;border:1px solid #3a3042;border-radius:9px;padding:9px 14px;text-decoration:none}.controls a.disabled{opacity:.35;pointer-events:none}.end{text-align:center;color:#e5c77b;margin-top:3rem}h3{color:#c9a95e}@media(max-width:600px){.chapter{padding:20px 16px}.chapter p{font-size:16px}}</style></head><body><main class="reader"><div class="controls" id="topControls"></div><article class="chapter" id="chapterBody"></article><div class="controls" id="bottomControls"></div></main><script>const chapters=[
  ["الفصل الأول — الليلة التي تأخر فيها الزمن",[
    "لم تكن نيراف مدينة تنام مبكرًا. كانت ورش الساعات تظل مضاءة حتى منتصف الليل، وتبقى أصوات المطارق الصغيرة تتردد في الأزقة كأن المدينة كلها قلب معدني لا يعرف الراحة. لكن تلك الليلة، وقبل أن تدق ساعة البرج منتصف الليل، توقفت جميع الساعات في اللحظة نفسها.",
    "كان يامن في العشرين، يعمل وحده في الورشة التي ورثها عن أبيه. لم يرَ والده منذ سبع سنوات، ولم يعرف أحد أين ذهب. ترك وراءه ورشة متواضعة ودفترًا جلديًا أغلقه يامن على أسئلة لم يجد لها جوابًا. كان الناس يقولون إن الرجل رحل بحثًا عن عمل، أما يامن فلم يصدق؛ فأبوه لم يكن من النوع الذي يختفي دون كلمة.",
    "على طاولة العمل استقرت ساعة جيب نحاسية تدور عقاربها إلى الخلف كلما حاول إصلاحها. فكك آليتها مرتين ونظف التروس، لكنها عادت إلى الحركة العكسية. وحين اقتربت من منتصف الليل، توقفت عند الرقم اثني عشر، ثم أصدرت دقة واحدة عميقة.",
    "انطفأت مصابيح الورشة. نظر يامن من النافذة فرأى خطًا أزرق يشق السماء من الشرق، ثم يهبط خلف جبال الصمت. اهتزت الأرض بعده بثوانٍ، وسقط صندوق أدوات من الرف. خرج الناس إلى الشوارع، لكن الضوء ظل معلقًا في السماء أطول مما ينبغي.",
    "فتح يامن درجًا بحثًا عن مصباحه، فاصطدمت يده بدفتر أبيه. تقلبت صفحاته حتى توقفت عند سطر كتبه والده: «إذا عاد النجم الأزرق، فلا تتبع الضوء... ابحث عما تركه خلفه». وتحت العبارة رسم لدائرة تحيط بها سبع نقاط، وتحذير آخر: «لا تفتح الباب وحدك».",
    "سار يامن إلى الوادي خلف جبال الصمت. وجد أشجارًا مقتلعة وصخورًا متشققة ودائرة من التراب الأسود. لم يجد نجمًا، بل حجرًا أسود بحجم قبضة اليد، تتوسطه سبعة خطوط زرقاء. ستة منها خافتة، أما الأول فكان ينبض بنور متقطع.",
    "تردد قبل لمسه. كان يستطيع العودة وطلب الحراس، لكنه خشي أن يأخذوا الحجر قبل أن يفهم صلته بأبيه. مد إصبعه ولمسه.",
    "اختفى صوت المطر والوادي. وجد نفسه في فضاء أسود أمام سبع بوابات: بحر لا ينتهي، ومدينة من البلور، وغابة مضيئة، وصحراء حمراء، وجبل معلق، ومملكة ثلج، ثم بوابة سابعة لا يظهر خلفها شيء. سمع صوتًا يقول: «لقد تأخرت». وأتبعه صوت آخر: «لا تدعه يعرف أنك استيقظت».",
    "عاد إلى الوادي على ركبتيه. أضاء الخط الأول في الحجر، وظهرت على كفه علامة زرقاء ثم اختفت. قرب الحفرة وجد قطعة معدنية تحمل دائرة وسبع نجوم، وتحتها كلمة استطاع قراءتها رغم أنه لم يتعلم لغتها: «القديس».",
    "عاد قبل الفجر. وفي صفحة ملتصقة بظهر دفتر أبيه وجد جملة واحدة: «حين يضيء الخط الأول، سيبحثون عنك قبل أن تعرف من تكون». وفي مكان بعيد خلف البوابة السابعة، فتح شخص عينيه وقال: «إذن... عاد وريث العهد الأول»."
  ]],
  ["الفصل الثاني — الباب الذي لا يُرى",[
    "لم ينم يامن. جلس أمام طاولة أبيه يراقب الحجر حتى بدأ ضوء الصباح يتسلل من النافذة. كان الخط الأول مضيئًا، لكنه لم يعد ينبض. أما العلامة التي ظهرت في كفه فلم تترك أثرًا، ومع ذلك شعر بوخز خفيف كلما اقترب من الحجر.",
    "قلب القطعة المعدنية بين أصابعه، فوجد على ظهرها سبعة شقوق دقيقة. ثم فتش الورشة بحثًا عن شيء آخر تركه والده. خلف رف قديم وجد لوحًا خشبيًا يخفي تجويفًا صغيرًا، بداخله مفتاح نحاسي وورقة مطوية.",
    "لم تحمل الورقة سوى رسم لممر ينتهي بقوس، وتحته عبارة: «الباب لا يظهر لمن يبحث عنه بعينيه». جرّب المفتاح في أقفال الورشة، فلم يفتح شيئًا. وحين وضعه بجوار الحجر، تحركت عقارب الساعة النحاسية وحدها.",
    "عند الظهيرة جاء تاجر الساعة ليسأل عنها. ما إن سمع دقتها حتى سحب يده وقال: «إن عادت إلى الدق، فلا تتركها قرب نافذة». لم يشرح شيئًا وغادر، تاركًا يامن أكثر حيرة.",
    "أغمض يامن عينيه محاولًا استعادة صورة البوابات. ظهر في ذهنه ممر ضيق، وعلى جانبيه جدران حجرية مبللة. شعر ببرودة المكان في أصابعه، وحين فتح عينيه وجد دائرة من الضوء تتشكل أمام الجدار الخلفي.",
    "اتسعت الدائرة حتى صارت إطار باب. خلفه امتد الممر نفسه الذي رآه في ذهنه. لم يكن في الجدار شق أو مفصل، ومع ذلك كان الباب واضحًا. تراجع يامن، وتذكر تحذير أبيه: لا تفتح الباب وحدك.",
    "من داخل الممر جاءت همسة: «إن دخلت حاملًا الحجر، فلن تجد طريق العودة». ثم جاء صوت آخر: «وإن تركته، فلن تعرف لماذا اختارك». لم يعرف أيهما يقول الحقيقة.",
    "عند العتبة ظهر أثر قدم حديث في الغبار، أصغر من قدمه. انحنى ليتفحصه، فسمع صوتًا خلفه: «أنت لا تعرف حتى كيف تغلقه». استدار، فلم يجد أحدًا.",
    "أضاء الحجر داخل حقيبته حتى نفذ الضوء من القماش. فهم يامن أن الباب يستجيب له، لا للمفتاح وحده. أمسك الحجر ووضع المفتاح في مركز الدائرة، فاختفى المفتاح وانفتح الممر.",
    "في نهايته رأى سماء خضراء وبحرًا أسود ساكنًا. عبر العتبة، فطُويت المسافة حوله في لحظة. وحين التفت لم يجد الورشة ولا الباب، بل جدارًا من الضباب ظهرت عليه سبع نقاط ثم تلاشت. على سطح الحجر ظهر رمز موجة صغيرة، وتحت الماء البعيد تحرك شيء ضخم."
  ]],
  ["الفصل الثالث — بحر لا يعرف الشاطئ",[
    "كان البحر ساكنًا إلى حد جعل يامن يشك في أنه ماء. امتد أسود تحت سماء خضراء، بلا موجة ولا رغوة، بينما بدت النجوم قريبة على نحو غير مألوف. لم يرَ شاطئًا في أي اتجاه.",
    "وجد نقشًا على المنصة الحجرية التي وصل إليها: «لا ينجو من البحر من يظن أنه يعرف عمقه». وعلى مسافة بعيدة ظهرت جزيرة صغيرة تتصل بالمنصة بممر من الصخور السوداء.",
    "تقدم بحذر. عند منتصف الطريق سمع همسات من تحت الماء تكرر أسماء لا يعرفها. تحركت دوائر زرقاء حول الصخور، ومر ظل طويل تحت السطح. كاد يسقط حين اهتز الحجر الذي يقف عليه.",
    "جاءه صوت فتاة من الجزيرة: «إن كنت تريد البقاء حيًا، فلا تتحرك عندما تسمع اسمك». كانت تقف حاملة رمحًا قصيرًا، وترتدي معطفًا أزرق عليه شارة ثلاث موجات.",
    "وصل يامن إلى الجزيرة. قالت الفتاة إن اسمها لينا، وإنه في بحر المرايا، أحد أقاليم العالم الأول. وحين رأت الحجر في يده تغير وجهها وسألته كيف حصل عليه. لم تجبه أسئلته عن البوابات، لكنها حذرته من أن البحر يتعلم أسماء العابرين من أفكارهم.",
    "قادته إلى كوخ مبني من ألواح سفن قديمة. كانت داخله خرائط وأوعية رمل فضي وصندوق يحمل شعار الدائرة والنجوم. قالت لينا إنها تبحث عن أخيها الذي اختفى بعد أن حاول تحذير قريته من جماعة تُعرف بحراس الصفر.",
    "قبل أن يسألها يامن عنهم، دوّى جرس في الخارج. أطفأت لينا المصباح وأشارت إليه بالصمت. مر ثلاثة أشخاص بعباءات رمادية، وعلى صدورهم دائرة فارغة. قال أحدهم: «الأثر وصل إلى الجزيرة. ابحثوا عن حامل الخط الأول».",
    "انتظرا حتى ابتعدوا، ثم أخرجت لينا خريطة تقود إلى منارة قديمة. قالت إن سجلًا عن البوابات محفوظ هناك، وإن الوصول إليه قبل الحراس قد يمنحهما إجابات. لم تدّعِ الثقة به؛ قالت بوضوح إنها تحتاج إلى معرفة ما يحمله الحجر، وهو يحتاج إلى من يعرف البحر.",
    "في المنارة وجدا سبع فجوات في باب حجري. استقرت القطعة المعدنية في الفجوة الأولى، فانفتح المدخل. كانت الجدران مغطاة بنقوش عن سبعة حَمَلة وعهد يمنع شخصًا واحدًا من امتلاك مفاتيح العوالم.",
    "قرأ يامن: «إذا عاد حامل الخط الأول، فليُختبر بالاختيار قبل القوة». عندها ارتجت المنارة وانسحب البحر عن الجزيرة، كاشفًا قاعًا مليئًا بأعمدة حجرية. في الوسط ظهرت بوابة سوداء تحمل الشعار نفسه.",
    "قالت لينا: «هذه ليست بوابة عبور. إنها قفل». رفع يامن الحجر، فسمع دقات تشبه ساعة أبيه. ظهر في زجاج النافذة انعكاس رجل يقف خلفه، رغم أن الغرفة لم يكن فيها أحد سواهما. استدار يامن، فوجد المكان خاليًا. وعندما عاد إلى النافذة، كان الانعكاس يبتسم."
  ]],
  [
    "الفصل الرابع — مدينة البلور",
    [
      "لم يكن الرجل في الانعكاس موجودًا حين استدار يامن، لكنه ظهر ثانية في زجاج النافذة. رفع إصبعه إلى شفتيه، ثم أشار إلى الباب الحجري أسفل المنارة. فهمت لينا الإشارة قبل يامن؛ أمسكت رمحها وقالت إن عليهما مغادرة المكان فورًا.",
      "انفتح الباب المؤدي إلى القاع وحده. لم يكن الماء قد عاد، لكن أرض البحر بدأت تهتز. نزلا درجات حجرية حتى وصلا إلى قاعة دائرية، في وسطها منصة تحمل بلورة شفافة. داخل البلورة تحركت صورة مدينة كاملة.",
      "قالت لينا إن تلك مدينة البلور، إحدى المدن الكبرى في العالم الأول، وإنها لم ترَ صورتها بهذا الوضوح من قبل. حين اقترب يامن، ظهر في البلورة وجه أبيه لثانية واحدة، ثم انطفأ المشهد.",
      "اندفع رجال العباءات الرمادية إلى القاعة. لم يهاجموهما، بل حاولوا إغلاق الممر خلفهما. صاح أحدهم بأن الحجر يجب أن يعود إلى موضعه قبل أن يفتح القفل. رفضت لينا تصديقه، وسحبت يامن نحو منصة البلورة.",
      "وضعت لينا كفها على سطحها، فانشق الضوء وظهر ممر أبيض. قالت إن الممر يصل إلى مدينة البلور، لكنه لا يفتح إلا لمن يحمل علامة من البحر. لم يكن أمامهما وقت لاختيار طريق آخر.",
      "عبرا الممر، فوجد يامن نفسه في ساحة واسعة تحيط بها أبراج شفافة. كانت المدينة تعكس كل شيء: السماء والوجوه وحتى الظلال. رأى انعكاسه على جدار قريب، لكنه تأخر نصف لحظة عن حركته.",
      "استقبلتهما امرأة تدعى سيرا، تعمل حارسة للأرشيف البلوري. لم تبدُ متفاجئة من ظهور لينا، لكنها خافت حين رأت الحجر. قالت إن آخر حامل للخطوط السبعة مر بالمدينة قبل سبع سنوات، وإن اسمه كان قريبًا من اسم يامن.",
      "سألها عن أبيه. أجابت أن السجلات لا تحفظ أسماء الزائرين، بل آثارهم؛ وكل أثر يُمحى إذا طلب صاحبه ذلك. ومع ذلك، كان هناك سجل واحد لم يستطع أحد محوه، محفوظ في قاعة الانعكاسات.",
      "في طريقهما إلى القاعة، شرحت سيرا أن البلور لا يكشف الحقيقة كاملة. إنه يعكس ما يعتقد الناظر أنه حقيقة، ولهذا يستخدمه أهل المدينة في المحاكم، لكنهم لا يعدّونه دليلًا نهائيًا. فهم يامن أن الانعكاس الذي رآه في المنارة قد يكون تحذيرًا أو خدعة.",
      "وجدوا السجل خلف سبعة ألواح. لم يحمل اسم الأب، بل رسمًا لعلامة الدائرة والنجوم، وأسفلها جملة: «الحامل السابق رفض أن يوقظ الخط السابع، واختار أن يختفي بدلًا من تسليم المفتاح». وقبل أن يقرأ يامن بقية السطر، ظهرت خلفهم سبعة انعكاسات لشخص واحد."
    ]
  ],
  [
    "الفصل الخامس — قاعة الانعكاسات",
    [
      "لم تتحرك الانعكاسات مع أصحابها. وقفت على الجدران كأنها أشخاص مستقلون، لكل واحد وجه يامن وملامحه، لكن عيونهم كانت تنظر إلى موضع مختلف. رفعت سيرا مصباحًا بلوريًا، فظهرت كتابة على الأرض تحذر من لمس أي سطح عاكس أثناء اضطراب القاعة.",
      "قالت لينا إن رجال العباءات وصلوا إلى المدينة قبلهم، وإنهم ربما زرعوا الانعكاسات لتتبع الحجر. لم يقتنع يامن؛ فالوجوه السبعة كانت ترتدي ملابس مختلفة، وإحدى النسخ بدت أكبر سنًا منه بعشرات السنوات.",
      "اقتربت النسخة الأكبر من الجدار، وكتبت بإصبعها جملة لم تظهر إلا في المرآة: «لا تثق بالذاكرة التي تُعرض عليك». ثم اختفت جميع النسخ دفعة واحدة.",
      "قادتهما سيرا إلى غرفة الأرشيف السفلي. هناك وجدوا خرائط قديمة للبحر والمدينة، وعلامات تشير إلى ممرات بين العوالم. أخبرتهما أن مدينة البلور لا تصنع البوابات؛ إنها تحفظ آثارها فقط، وأن كل عبور يترك شقًا في ذاكرة المكان.",
      "في درج مغلق عثرت لينا على سجل يحمل اسم أخيها، نادر. آخر تدوين له يقول إنه غادر إلى غابة الذاكرة بحثًا عن شخص يستطيع إعادة ذكرى سُرقت منه. لم تخبر يامن من قبل أن أخاها كان يبحث عن ذاكرته، لا عن مجرد مفقود.",
      "سألها يامن لماذا لم تقل ذلك. أجابت أن بعض الأسرار لا تُقال لشخص التقت به قبل ساعات، ثم أضافت أنها لا تريد أن يصبح أخوها وسيلة لإقناع حامل الحجر بمساعدتها. كان ذلك أول خلاف حقيقي بينهما.",
      "قبل أن يتصالحا، انطفأت مصابيح الأرشيف. دخل رجل طويل يرتدي قناعًا من زجاج معتم، ولم يظهر له انعكاس على الجدران. قال إنه لا يمثل حراس الصفر، وإن عليهما تسليم السجل والحجر معًا.",
      "رفضت سيرا تسليمهما. ضرب الرجل الأرض بعصاه، فانقسمت البلاطات إلى ألواح عاكسة ارتفعت حولهم. لم يكن يامن يعرف القتال، فتراجع إلى جانب لينا بينما حاولت هي حماية سيرا.",
      "لاحظ يامن أن الرجل لا يظهر في البلور، لكنه يظهر في سطح الماء داخل كأس صغير. دفع الكأس إلى الأرض، فانعكس وجه الرجل للحظة، وارتج القناع. استغلت لينا اللحظة وأغلقت باب القاعة.",
      "هرب الثلاثة عبر ممر الخدمة. أعطت سيرا يامن شظية بلورية وقالت إنها ستكشف التغيّر في الانعكاس، لا الحقيقة نفسها. ثم فتحت لهم مخرجًا إلى غابة الذاكرة، محذرة إياهم من أن ما يراه المرء هناك قد يكون أصدق من اللازم، أو كاذبًا بالطريقة الأكثر إيلامًا."
    ]
  ],
  [
    "الفصل السادس — غابة الذاكرة",
    [
