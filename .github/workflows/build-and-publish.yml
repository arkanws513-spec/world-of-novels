name: Build and publish novels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novels-publisher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the complete static library
        run: node scripts/build.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json novels/saint-of-seven-worlds.html novels/saint-chapter-*.html naruto-legacy-of-worlds/index.html naruto-legacy-of-worlds/chapter-*.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build novel pages automatically"
            git push
          fi
