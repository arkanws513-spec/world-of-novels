name: Build and publish novels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novels-publisher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and publish generated chapters safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Build attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            node scripts/build.mjs
            git add -A
            if git diff --cached --quiet; then
              echo "No generated changes."
              exit 0
            fi
            git commit -m "Build novel pages automatically"
            if git push origin HEAD:main; then
              echo "Generated pages published."
              exit 0
            fi
            echo "Branch changed during publishing; retrying from latest main."
          done
          echo "Could not publish after five attempts."
          exit 1
