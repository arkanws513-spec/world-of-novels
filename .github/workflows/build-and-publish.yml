name: Build and publish novels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novels-publisher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: |
          node --check script.js
          node --check reader-controls.js
          node --check site-analytics.js
          node --check stats-dashboard.js
          node --check admin.js
          node --check scripts/build.mjs
      - name: Build and publish generated chapters safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Build attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            node scripts/build.mjs
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const fail = message => { console.error(message); process.exit(1); };
          const manifest = JSON.parse(fs.readFileSync("content/novels.json", "utf8"));
          const catalog = JSON.parse(fs.readFileSync("catalog.json", "utf8"));
          if (!Array.isArray(manifest.novels) || manifest.novels.length === 0) fail("Manifest has no novels.");
          if (!Array.isArray(catalog.novels) || catalog.novels.length !== manifest.novels.length) fail("Catalog and manifest novel counts differ.");
          const ids = manifest.novels.map(n => n.id);
          if (new Set(ids).size !== ids.length) fail("Novel IDs must be unique.");
          for (const novel of manifest.novels) {
            if (!catalog.novels.some(item => item.id === novel.id && item.link === novel.indexPath)) fail("Novel missing or mismatched in catalog: " + novel.id);
          }
          let chapterCount = 0;
          for (const novel of catalog.novels) {
            if (!fs.existsSync(novel.link)) fail("Missing novel index: " + novel.link);
            if (novel.cover && !fs.existsSync(novel.cover)) fail("Missing novel cover: " + novel.cover);
            const indexHtml = fs.readFileSync(novel.link, "utf8");
            if (!indexHtml.includes("site-analytics.js")) fail("Analytics script missing from: " + novel.link);
            for (const chapter of novel.chapters) {
              const file = chapter.url;
              if (!fs.existsSync(file)) fail("Missing generated chapter: " + file);
              const html = fs.readFileSync(file, "utf8");
              for (const marker of ["reader-toolbar", "reader-controls.js", "site-analytics.js", "chapterContent", "readingProgress"]) {
                if (!html.includes(marker)) fail("Chapter " + file + " is missing " + marker);
              }
              chapterCount++;
            }
          }
          const home = fs.readFileSync("index.html", "utf8");
          for (const marker of ["script.js", "style.css", "stats.html"]) {
            if (!home.includes(marker)) fail("Homepage is missing " + marker);
          }
          if (!fs.readFileSync("script.js", "utf8").includes('fetch("catalog.json")')) fail("Homepage script is not loading the catalog.");
          if (!fs.existsSync("stats.html") || !fs.existsSync("site-analytics.js") || !fs.existsSync("stats-dashboard.js")) fail("Analytics files are missing.");
          if (!fs.existsSync("admin.html") || !fs.existsSync("admin.css") || !fs.existsSync("admin.js")) fail("Admin dashboard files are missing.");
          if (!fs.readFileSync("admin.html", "utf8").includes("admin.js")) fail("Admin dashboard script is not connected.");
          const admin = fs.readFileSync("admin.js", "utf8");
          if (!admin.includes("content/novels.json")) fail("Admin dashboard cannot load the novel manifest.");
          if (!admin.includes("exportNovelPackage")) fail("Admin dashboard cannot export a standalone novel package.");
          if (!fs.readFileSync("stats.html", "utf8").includes("stats-dashboard.js")) fail("Stats dashboard script is not connected.");
          const readerControls = fs.readFileSync("reader-controls.js", "utf8");
          for (const feature of ["readerBookmark", "readerSpeak", "chapterJump", "worldOfNovels:lastRead"]) {
            if (!readerControls.includes(feature)) fail("Reader feature is missing: " + feature);
          }
          if (!home.includes("bookmarksCard") || !fs.readFileSync("script.js", "utf8").includes("renderBookmarks")) fail("Homepage bookmark shelf is not connected.");
          const novelRoot = "content/novels";
          for (const folder of fs.readdirSync(novelRoot, { withFileTypes: true }).filter(item => item.isDirectory())) {
            const metadataPath = path.join(novelRoot, folder.name, "novel.json");
            if (!fs.existsSync(metadataPath)) continue;
            const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
            if (!manifest.novels.some(novel => novel.id === metadata.id)) fail("Novel package was not discovered: " + metadataPath);
          }
          const sitemap = fs.readFileSync("sitemap.xml", "utf8");
          for (const novel of catalog.novels) {
            if (!sitemap.includes(novel.link)) fail("Sitemap is missing novel URL: " + novel.link);
            for (const chapter of novel.chapters) if (!sitemap.includes(chapter.url)) fail("Sitemap is missing chapter URL: " + chapter.url);
          }
          console.log("Validation passed: manifest and catalog match (" + catalog.novels.length + " novels, " + chapterCount + " chapters).");
          NODE
            git add -A
            if git diff --cached --quiet; then
              echo "No generated changes."
              exit 0
            fi
            git commit -m "Build novel pages automatically"
            if git push origin HEAD:main; then
              echo "Generated pages published."
              exit 0
            fi
            echo "Branch changed during publishing; retrying from latest main."
          done
          echo "Could not publish after five attempts."
          exit 1
