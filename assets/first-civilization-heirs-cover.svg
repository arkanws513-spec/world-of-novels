<path d="M235 850L355 670L475 850Z" fill="#b88b48" stroke="#ffe2a0" stroke-width="4"/><path d="M365 850L485 690L605 850Z" fill="#886333" stroke="#e5bd73" stroke-width="4"/>
<path d="M355 670L355 850L235 850Z" fill="#e2b866" opacity=".25"/><path d="M485 690L485 850L365 850Z" fill="#f2d28e" opacity=".18"/>
