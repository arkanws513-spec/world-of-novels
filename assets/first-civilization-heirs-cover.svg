<path d="M450 275l-35 55h70Z" fill="none" stroke="url(#gold)" stroke-width="7"/><path d="M450 330v65m-24-25h48" stroke="url(#gold)" stroke-width="7" fill="none"/>
<text x="450" y="105" fill="#f0c76e" font-family="serif" font-size="34" text-anchor="middle" letter-spacing="8">رواية خيال علمي</text>
<text x="450" y="205" fill="url(#gold)" font-family="serif" font-size="74" font-weight="bold" text-anchor="middle">ورثة الحضارة</text>
<text x="450" y="290" fill="url(#gold)" font-family="serif" font-size="82" font-weight="bold" text-anchor="middle">الأولى</text>
