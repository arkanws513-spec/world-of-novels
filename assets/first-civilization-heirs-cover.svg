<text x="450" y="965" fill="#f5e7c5" font-family="serif" font-size="30" text-anchor="middle">من حلم إنسان واحد...</text>
<text x="450" y="1015" fill="#f5e7c5" font-family="serif" font-size="30" text-anchor="middle">إلى مستقبل حضارة بين النجوم</text>
<path d="M230 1055H670" stroke="#d9aa50" stroke-width="2"/>
<text x="450" y="1110" fill="#dcb96e" font-family="serif" font-size="24" text-anchor="middle">عالم الروايات</text>
</svg>