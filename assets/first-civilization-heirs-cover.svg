<g fill="#172944" stroke="#d4a64f" stroke-width="3">
 <path d="M85 790V625H130V790Z"/><path d="M145 790V570H195V790Z"/><path d="M215 790V650H260V790Z"/>
 <path d="M620 760V560H670V760Z"/><path d="M685 760V500H740V760Z"/><path d="M755 760V610H810V760Z"/>
 <path d="M355 760V580H390V760Z"/><path d="M405 760V525H450V760Z"/><path d="M465 760V600H505V760Z"/>
</g>
<g stroke="#75caff" stroke-width="5" opacity=".8"><path d="M160 600V750M700 530V735M425 550V740M640 580V730"/></g>
