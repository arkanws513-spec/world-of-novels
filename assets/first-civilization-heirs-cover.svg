<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
<title id="title">ورثة الحضارة الأولى</title><desc id="desc">غلاف خيال علمي لمدينة مصرية مستقبلية بين الأرض والنجوم</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#050b20"/><stop offset=".58" stop-color="#101b39"/><stop offset="1" stop-color="#050711"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ffe5a0" stop-opacity=".95"/><stop offset="1" stop-color="#e5a83a" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff1b8"/><stop offset=".45" stop-color="#e8b64d"/><stop offset="1" stop-color="#8b5420"/></linearGradient>
 <linearGradient id="planet" x2="0" y2="1"><stop stop-color="#6689b7"/><stop offset=".45" stop-color="#233e68"/><stop offset="1" stop-color="#081329"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="900" height="1200" fill="url(#bg)"/>
<g fill="#fff"><circle cx="85" cy="100" r="2"/><circle cx="180" cy="180" r="2"/><circle cx="745" cy="125" r="2"/><circle cx="810" cy="270" r="2"/><circle cx="600" cy="205" r="1.8"/><circle cx="320" cy="270" r="1.5"/><circle cx="95" cy="410" r="1.5"/><circle cx="710" cy="390" r="2"/><circle cx="450" cy="80" r="1.5"/><circle cx="540" cy="330" r="1.2"/><circle cx="255" cy="350" r="1.4"/></g>
<circle cx="710" cy="250" r="155" fill="url(#glow)" filter="url(#blur)"/><circle cx="710" cy="250" r="95" fill="#d8e5f5" opacity=".9"/><path d="M625 230 Q710 190 795 228 Q750 285 660 300Z" fill="#8196b7" opacity=".35"/>
<path d="M0 690 Q220 610 420 680 T900 650 L900 1200H0Z" fill="url(#planet)"/>
<path d="M0 745 Q220 660 430 735 T900 700" fill="none" stroke="#9fc8f5" stroke-opacity=".6" stroke-width="5"/>
<circle cx="450" cy="730" r="180" fill="url(#glow)" opacity=".8"/>
<!-- orbital rings -->
<ellipse cx="470" cy="635" rx="390" ry="95" fill="none" stroke="#e9bd65" stroke-width="4" opacity=".65" transform="rotate(-12 470 635)"/>
<ellipse cx="470" cy="635" rx="330" ry="65" fill="none" stroke="#79c9ff" stroke-width="2" opacity=".65" transform="rotate(-12 470 635)"/>
