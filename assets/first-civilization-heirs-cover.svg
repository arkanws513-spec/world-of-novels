<path d="M80 485L300 440L445 465L310 490L155 505Z" fill="#b6d6ef" stroke="#f6d48b" stroke-width="3"/><path d="M175 480L300 455L390 466L290 479Z" fill="#1d4164"/><path d="M82 485L30 510L160 501Z" fill="#5daee5"/>
<path d="M520 420L660 390L805 415L675 438Z" fill="#c7d9e8" stroke="#e6b85d" stroke-width="3"/><path d="M610 415L680 402L755 414L675 426Z" fill="#1b3d60"/>
