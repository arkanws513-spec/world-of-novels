<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ناروتو: إرث العوالم — قراءة الفصول</title><link rel="stylesheet" href="../style.css?v=2"><style>body{background:#11131a;color:#eee;font-family:Tahoma,Arial,sans-serif;line-height:2}.reader{max-width:850px;margin:35px auto;padding:0 16px}.chapter{background:#15121a;border:1px solid #2c2632;border-radius:18px;padding:clamp(22px,5vw,45px)}.chapter h1{text-align:center;color:#e5c77b;margin-bottom:30px}.chapter p{font-size:19px;line-height:2.25;color:#ddd;margin:0 0 22px}.chapter-label{text-align:center;color:#c99a5b;margin-bottom:10px}.controls{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.controls a{background:#1b1721;color:#e5c77b;border:1px solid #3a3042;border-radius:9px;padding:9px 14px;text-decoration:none}.controls a.disabled{opacity:.35;pointer-events:none}.end{text-align:center;color:#e5c77b;margin-top:3rem}h3{color:#c9a95e}@media(max-width:600px){.chapter{padding:20px 16px}.chapter p{font-size:16px}}</style></head><body><main class="reader"><div class="controls" id="topControls"></div><article class="chapter" id="chapterBody"></article><div class="controls" id="bottomControls"></div></main><script>const chapters=[
[
"الفصل الأول: ما وراء الأفق",
[

["p","على أحد المرتفعات الصخرية، وقف رجل يرتدي عباءة داكنة، وقد غطى جزء منها جسده وذراعه اليسرى."],
["p","كان شعره الأسود يتحرك مع الرياح، وعيناه تتأملان الأفق بصمت."],

["p","كان يبحث."],
["p","خطا بضع خطوات نحو حافة المرتفع، ثم توقف."],

["p","ساسكي: «...لا شيء.»"],

["p","لم تكن المعلومات التي حصل عليها كافية لتكوين صورة واضحة، لكنها كانت كافية لإبقائه بعيداً عن كونوها طوال هذه المدة."],
["p","رفع رأسه نحو السماء."],
["p","ساسكي: «هناك شيء يتحرك... لكن ما زال مبكراً لمعرفة حقيقته.»"],
["p","طوى الورقة وأعادها إلى مكانها."],
["p","ثم استدار، وبدأ يسير مبتعداً عن المرتفع."],
["p","لم يكن يعلم أن الأيام القادمة ستجعل ما يبحث عنه أكبر بكثير مما توقع."],

["p","كاكاشي: «يبدو أن اليوم سيكون أطول مما توقعت.»"],
["p","جاء صوت من خلف الباب:"],

]
]
];
const n=Math.max(1,Math.min(chapters.length,Number(new URLSearchParams(location.search).get("c"))||1));const chapterBody=document.getElementById("chapterBody");chapterBody.innerHTML='<div class="chapter-label">الفصل '+n+' من '+chapters.length+'</div><h1>'+chapters[n-1][0]+'</h1>'+chapters[n-1][1].map(([tag,txt])=>tag==="h3"?"<h3>"+txt+"</h3>":txt==="نهاية الفصل الأول"?'<p class="end"><strong>'+txt+'</strong></p>':"<p>"+txt+"</p>").join('');

document.getElementById("topControls").innerHTML=controls();document.getElementById("bottomControls").innerHTML=controls();document.title=chapters[n-1][0]+" — ناروتو: إرث العوالم";</script><script src="../reader-tools.js" defer></script>
